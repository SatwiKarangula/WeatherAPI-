apiVersion: apps/v1
kind: Deployment

metadata:
  name: weather-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: weather-api

  template:
    metadata:
      labels:
        app: weather-api

    spec:
      containers:
        - name: weather-api
          image: weather-api:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: weather-secret